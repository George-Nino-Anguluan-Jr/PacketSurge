name: Export and Build iOS Game

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14

    steps:
      # Step 1: Checkout repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Setup Godot and download templates automatically
      - name: Setup Godot Engine
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.2.2 # ⚠️ Change to your exact Godot version if different
          use-dotnet: false
          include-templates: true

      # Step 3: Import project resources/autoloads BEFORE exporting
      - name: Import Godot Project Cache
        run: |
          godot --headless --editor --quit || true

      # Step 4: Fix Godot iOS Code Signing Settings before export
      - name: Clear Conflicting Signing Identity in Presets
        run: |
          if [ -f "export_presets.cfg" ]; then
            sed -i '' 's/iPhone Distribution//g' export_presets.cfg
            sed -i '' 's/iPhone Developer//g' export_presets.cfg
          fi

      # Step 5: Export the Xcode Project from Godot
      - name: Export Xcode Project
        run: |
          mkdir -p build/ios
          godot --headless --export-release "iOS" build/ios/GameExport.xcodeproj

      # Step 6: Fix generated Xcode project file to disable signing conflicts
      - name: Patch Xcode Project File
        run: |
          sed -i '' 's/CODE_SIGN_IDENTITY = "iPhone Distribution";/CODE_SIGN_IDENTITY = "";/g' build/ios/GameExport.xcodeproj/project.pbxproj || true
          sed -i '' 's/CODE_SIGN_IDENTITY = "iPhone Developer";/CODE_SIGN_IDENTITY = "";/g' build/ios/GameExport.xcodeproj/project.pbxproj || true

      # Step 7: Build Xcode Project
      - name: Build Xcode Project
        run: |
          cd build/ios
          xcodebuild -project GameExport.xcodeproj \
                     -scheme "GameExport" \
                     -sdk iphoneos \
                     -configuration Release \
                     CODE_SIGN_IDENTITY="" \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGNING_ALLOWED=NO \
                     build

      # Step 8: Upload build artifact
      - name: Upload iOS Xcode Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-xcode-build
          path: build/ios/
