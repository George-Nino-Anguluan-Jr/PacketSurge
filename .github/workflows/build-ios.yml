name: Build iOS IPA

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14

    steps:
      # Step 1: Checkout repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Setup Godot 4.7 Engine & Templates
      - name: Setup Godot Engine
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.0 # Updated to match your Godot 4.7 version
          use-dotnet: false
          include-templates: true

      # Step 3: Import Godot Project Cache
      - name: Import Godot Cache
        run: |
          godot --headless --editor --quit || true

      # Step 4: Configure App Identifier & Clear Signing IDs in Presets
      - name: Patch Bundle Identifier & Preset Settings
        run: |
          if [ -f "export_presets.cfg" ]; then
            sed -i '' 's/application\/bundle_identifier=.*/application\/bundle_identifier="com.thesisteam.packetsurge"/g' export_presets.cfg
            sed -i '' 's/code_sign\/identity_release=.*/code_sign\/identity_release=""/g' export_presets.cfg
            sed -i '' 's/code_sign\/identity_debug=.*/code_sign\/identity_debug=""/g' export_presets.cfg
            sed -i '' 's/code_sign\/apple_team_id=.*/code_sign\/apple_team_id=""/g' export_presets.cfg
          fi

      # Step 5: Export Xcode Project from Godot 4.7
      - name: Export Xcode Project
        run: |
          mkdir -p build/ios
          godot --headless --export-debug "iOS" build/ios/PacketSurge.xcodeproj || true

      # Step 6: Configure Xcode build flags for unsigned build
      - name: Patch Xcode Project Settings
        run: |
          PROJECT_FILE="build/ios/PacketSurge.xcodeproj/project.pbxproj"
          if [ -f "$PROJECT_FILE" ]; then
            sed -i '' 's/CODE_SIGNING_ALLOWED = YES/CODE_SIGNING_ALLOWED = NO/g' "$PROJECT_FILE"
            sed -i '' 's/CODE_SIGNING_REQUIRED = YES/CODE_SIGNING_REQUIRED = NO/g' "$PROJECT_FILE"
            sed -i '' 's/CODE_SIGN_IDENTITY = ".*";/CODE_SIGN_IDENTITY = "";/g' "$PROJECT_FILE"
            sed -i '' 's/DevelopmentTeam = ".*";/DevelopmentTeam = "";/g' "$PROJECT_FILE"
          fi

      # Step 7: Build unsigned .xcarchive via xcodebuild
      - name: Build Xcode Archive
        run: |
          cd build/ios
          xcodebuild -project PacketSurge.xcodeproj \
                     -scheme "PacketSurge" \
                     -sdk iphoneos \
                     -configuration Debug \
                     -archivePath PacketSurge.xcarchive \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGN_IDENTITY="" \
                     DEVELOPMENT_TEAM="" \
                     archive

      # Step 8: Package into an unsigned .ipa
      - name: Create Unsigned IPA Package
        run: |
          cd build/ios/PacketSurge.xcarchive/Products/Applications
          mkdir Payload
          mv *.app Payload/
          zip -r PacketSurge.ipa Payload
          mv PacketSurge.ipa ../../../

      # Step 9: Upload IPA Artifact to GitHub
      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PacketSurge-Unsigned-IPA
          path: build/ios/PacketSurge.ipa
