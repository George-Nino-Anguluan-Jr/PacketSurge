name: Export and Build iOS Game

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14

    steps:
      # Step 1: Checkout repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Setup Godot Engine & Templates
      - name: Setup Godot Engine
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.2.2 # ⚠️ Change to your exact Godot version if different
          use-dotnet: false
          include-templates: true

      # Step 3: Import Godot Project Cache
      - name: Import Godot Project Cache
        run: |
          godot --headless --editor --quit || true

      # Step 4: Clean export_presets.cfg signing identities safely
      - name: Clear Presets Signing
        run: |
          if [ -f "export_presets.cfg" ]; then
            sed -i '' 's/code_sign\/identity_release=.*/code_sign\/identity_release=""/g' export_presets.cfg
            sed -i '' 's/code_sign\/identity_debug=.*/code_sign\/identity_debug=""/g' export_presets.cfg
          fi

      # Step 5: Export Xcode Project from Godot
      - name: Export Xcode Project
        run: |
          mkdir -p build/ios
          godot --headless --export-debug "iOS" build/ios/GameExport.xcodeproj

      # Step 6: Fix Xcode project settings to allow build without Apple Account
      - name: Patch Xcode Project Settings
        run: |
          PROJECT_FILE="build/ios/GameExport.xcodeproj/project.pbxproj"
          if [ -f "$PROJECT_FILE" ]; then
            sed -i '' 's/CODE_SIGNING_ALLOWED = YES/CODE_SIGNING_ALLOWED = NO/g' "$PROJECT_FILE"
            sed -i '' 's/CODE_SIGNING_REQUIRED = YES/CODE_SIGNING_REQUIRED = NO/g' "$PROJECT_FILE"
            sed -i '' 's/CODE_SIGN_IDENTITY = ".*";/CODE_SIGN_IDENTITY = "";/g' "$PROJECT_FILE"
            sed -i '' 's/DevelopmentTeam = ".*";/DevelopmentTeam = "";/g' "$PROJECT_FILE"
          fi

      # Step 7: Build the project using xcodebuild
      - name: Build Xcode Project
        run: |
          cd build/ios
          xcodebuild -project GameExport.xcodeproj \
                     -scheme "GameExport" \
                     -sdk iphoneos \
                     -configuration Debug \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGN_IDENTITY="" \
                     PROVISIONING_PROFILE_SPECIFIER="" \
                     DEVELOPMENT_TEAM="" \
                     build

      # Step 8: Upload build artifact
      - name: Upload iOS Xcode Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-xcode-build
          path: build/ios/
