name: Export and Build iOS Game

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14

    steps:
      # Step 1: Checkout repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Setup Godot and download templates automatically
      - name: Setup Godot Engine
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.2.2 # ⚠️ Change to your exact Godot version if different
          use-dotnet: false
          include-templates: true

      # Step 3: Import project resources/autoloads BEFORE exporting
      - name: Import Godot Project Cache
        run: |
          godot --headless --editor --quit || true

      # Step 4: Export the Xcode Project from Godot
      - name: Export Xcode Project
        run: |
          mkdir -p build/ios
          godot --headless --export-release "iOS" build/ios/GameExport.xcodeproj

      # Step 5: Build Xcode Project
      - name: Build Xcode Project
        run: |
          cd build/ios
          xcodebuild -project GameExport.xcodeproj \
                     -scheme "GameExport" \
                     -sdk iphoneos \
                     -configuration Release \
                     CODE_SIGN_IDENTITY="" \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGNING_ALLOWED=NO \
                     build

      # Step 6: Upload build artifact
      - name: Upload iOS Xcode Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-xcode-build
          path: build/ios/