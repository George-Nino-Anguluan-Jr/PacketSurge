name: Export and Build iOS Game

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14

    steps:
      # Step 1: Checkout repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Setup Godot and download templates
      - name: Setup Godot Engine
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.2.2 # ⚠️ Change to your exact Godot version if different
          use-dotnet: false
          include-templates: true

      # Step 3: Import project resources/autoloads BEFORE exporting
      - name: Import Godot Project Cache
        run: |
          godot --headless --editor --quit || true

      # Step 4: Force preset settings to use Development identity
      - name: Patch Export Presets
        run: |
          if [ -f "export_presets.cfg" ]; then
            sed -i '' 's/code_sign\/identity_release=.*/code_sign\/identity_release=""/g' export_presets.cfg
            sed -i '' 's/code_sign\/identity_debug=.*/code_sign\/identity_debug=""/g' export_presets.cfg
          fi

      # Step 5: Export Xcode Project (Using Debug flag to avoid Distribution lock)
      - name: Export Xcode Project
        run: |
          mkdir -p build/ios
          godot --headless --export-debug "iOS" build/ios/GameExport.xcodeproj

      # Step 6: Clean out any residual Distribution references in generated .pbxproj
      - name: Patch Xcode Project File
        run: |
          sed -i '' 's/iPhone Distribution/Apple Development/g' build/ios/GameExport.xcodeproj/project.pbxproj
          sed -i '' 's/iPhone Developer/Apple Development/g' build/ios/GameExport.xcodeproj/project.pbxproj
          sed -i '' 's/CODE_SIGN_IDENTITY = ".*";/CODE_SIGN_IDENTITY = "";/g' build/ios/GameExport.xcodeproj/project.pbxproj
          sed -i '' 's/CODE_SIGNING_REQUIRED = YES;/CODE_SIGNING_REQUIRED = NO;/g' build/ios/GameExport.xcodeproj/project.pbxproj

      # Step 7: Build Xcode Project
      - name: Build Xcode Project
        run: |
          cd build/ios
          xcodebuild -project GameExport.xcodeproj \
                     -scheme "GameExport" \
                     -sdk iphoneos \
                     -configuration Debug \
                     CODE_SIGN_IDENTITY="" \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGNING_ALLOWED=NO \
                     build

      # Step 8: Upload build artifact
      - name: Upload iOS Xcode Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-xcode-build
          path: build/ios/
